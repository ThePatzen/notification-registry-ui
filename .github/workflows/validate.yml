name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14 for Home Assistant 2026.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned Python test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.3" \
            "pytest-asyncio==1.4.0" \
            "pytest-homeassistant-custom-component==0.13.354" \
            "ruff==0.16.5"
      - name: Python lint
        run: ruff check custom_components tests
      - name: Python tests
        run: python -m pytest -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend tests
        run: |
          npm ci
          npm test -- --run
      - name: live-preflight documentation
        run: echo "Live preflight is required before installing into a running Home Assistant instance; CI does not mutate HA."
